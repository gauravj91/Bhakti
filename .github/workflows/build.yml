Bhakti Alarm is a devotional alarm clock, daily panchang and Hindu calendar in one app. Wake up to an aarti or bhajan with full-screen darshan of your Bhagwan, then check today's tithi, Rahu Kaal and shubh muhurat, and never miss a vrat or festival again.

