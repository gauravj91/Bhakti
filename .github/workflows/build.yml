Shall I upload the .aab to the play store?

Not yet, because there's no Play-ready AAB. Your builds still produce debug-signed APKs, and Play rejects those. Do three things in one go: replace .github/workflows/build.yml with this file, add the 3 secrets from GITHUB-SECRETS.txt, and upload the latest BhaktiAlarm-source.zip. The next release will include a signed .aab. Upload it to Internal testing first, then Closed testing to start the 12-tester, 14-day clock.
build.yml

name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BHAKTI_KEYSTORE_PASSWORD: ${{ secrets.BHAKTI_KEYSTORE_PASSWORD }}
      BHAKTI_KEY_ALIAS: ${{ secrets.BHAKTI_KEY_ALIAS }}
      BHAKTI_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q BhaktiAlarm-source.zip -d app
      - run: if [ -d assets ]; then cp -r assets/. app/assets/; fi
      - name: Upload key (from repo secrets)
        env:
          KS_B64: ${{ secrets.BHAKTI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.p12"
            echo "BHAKTI_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
          fi
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: app
        run: |
          npm ci
          node scripts/sync-assets.js
          npx expo prebuild -p android --no-install
          cd android && ./gradlew assembleRelease bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../BhaktiAlarm-${{ github.run_number }}.apk
          cp app/build/outputs/bundle/release/app-release.aab ../../BhaktiAlarm-${{ github.run_number }}.aab
      - uses: actions/upload-artifact@v4
        with: { name: BhaktiAlarm, path: "BhaktiAlarm-*.*" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bhakti Alarm build ${{ github.run_number }}
          files: |
            BhaktiAlarm-*.apk
            BhaktiAlarm-*.aab

