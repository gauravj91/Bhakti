name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q BhaktiAlarm-source.zip -d app
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: app
        run: |
          npm ci
          node scripts/sync-assets.js
          npx expo prebuild -p android --no-install
          cd android && ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../../BhaktiAlarm-${{ github.run_number }}.apk
      - uses: actions/upload-artifact@v4
        with: { name: BhaktiAlarm-apk, path: "BhaktiAlarm-*.apk" }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Bhakti Alarm build ${{ github.run_number }}
          files: BhaktiAlarm-*.apk
